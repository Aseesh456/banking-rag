name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t banking-rag:ci .

      - name: Start container
        run: |
          docker run -d --name rag -p 8000:8000 \
            -e APP_API_KEY=ci-test-key -e GEMINI_API_KEY=dummy \
            banking-rag:ci

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health; then echo; exit 0; fi
            sleep 3
          done
          docker logs rag
          exit 1

      - name: Endpoint rejects requests without the API key
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/documents)
          test "$code" = "401"

      - name: Endpoint accepts requests with the API key
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "X-API-Key: ci-test-key" http://localhost:8000/documents)
          test "$code" = "200"

      - name: Show logs on failure
        if: failure()
        run: docker logs rag

  publish:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/aseesh456/banking-rag:latest
